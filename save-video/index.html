<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Save the clip</title>
<style>
  body { font: 17px/1.4 -apple-system, system-ui, sans-serif; margin: 0; padding: 16px; background: #fff; color: #111; }
  video { width: 100%; border-radius: 8px; background: #000; }
  button, a.btn { display: block; width: 100%; box-sizing: border-box; margin-top: 16px; padding: 16px; font-size: 18px; font-weight: 600; text-align: center; border: 0; border-radius: 12px; background: #0a66ff; color: #fff; text-decoration: none; }
  button:disabled { background: #9db8e8; }
  a.btn { background: #e8ecf3; color: #111; }
  #msg { margin-top: 12px; color: #555; }
</style>
</head>
<body>
<video src="/assets/video/robot_video_latency_dublin_london.mp4" controls muted playsinline loop autoplay></video>
<button id="save" disabled>Loading video…</button>
<a class="btn" href="/assets/video/robot_video_latency_dublin_london.mp4" download="robot_video_latency.mp4">Download file instead</a>
<p id="msg"></p>
<script>
  const btn = document.getElementById('save'), msg = document.getElementById('msg');
  let file;
  fetch('/assets/video/robot_video_latency_dublin_london.mp4')
    .then(r => r.blob())
    .then(b => {
      file = new File([b], 'robot_video_latency.mp4', { type: 'video/mp4' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        btn.textContent = 'Save video'; btn.disabled = false;
      } else {
        btn.textContent = 'Sharing not supported here';
        msg.textContent = 'Use "Download file instead".';
      }
    })
    .catch(() => { btn.textContent = 'Could not load video'; });
  btn.addEventListener('click', () => {
    navigator.share({ files: [file] }).catch(e => {
      if (e.name !== 'AbortError') msg.textContent = 'Share failed: ' + e.message;
    });
  });
</script>
</body>
</html>
